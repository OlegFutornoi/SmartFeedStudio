description = "Start structured specification authoring before writing code"

prompt = """
Invoke the planning-and-lifecycle and contract-first-api skills.

Begin by understanding what the user wants to build. Ask clarifying questions about:
1. The objective and target users
2. Core features and acceptance criteria
3. Tech stack preferences and constraints
4. Known boundaries (what to always do, ask first about, and never do)

Then generate a structured spec covering all six core areas: objective, commands, project structure, code style, testing strategy, and boundaries.

If the request bundles several independently testable capabilities, first propose a capability map (module ids, dependency direction, build order) and get it approved, then spec each module in dependency order.

Save the specification in plans/active/ and confirm with the user before proceeding.
"""