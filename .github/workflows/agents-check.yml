name: Agents & Skills Architecture Check

on:
  push:
    paths:
      - '.agents/**'
      - 'AGENTS.md'
      - 'scripts/**'
      - 'tools/guardrails/**'
      - '.github/workflows/agents-check.yml'
  pull_request:
    paths:
      - '.agents/**'
      - 'AGENTS.md'
      - 'scripts/**'
      - 'tools/guardrails/**'
      - '.github/workflows/agents-check.yml'

jobs:
  agents-verify:
    name: Verify Agents Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Agents Structural Integrity & Secrets
        run: node .agents/scripts/validate-agents.mjs

      - name: Run Guards Unit Tests
        run: node --test .agents/scripts/*.test.mjs

      - name: Verify All 62 Skill Eval Suites (Dry-Run)
        run: node scripts/ops/run-skill-evals.mjs --dry-run

      - name: Verify Prompt Token & Instruction Budgets
        run: node .agents/scripts/check-budget.mjs

      - name: Scan Skills for Malicious Patterns
        run: node .agents/scripts/scan-skills-security.mjs
