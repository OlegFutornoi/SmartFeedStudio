name: Skill Quality & Structural Gate

on:
  push:
    paths:
      - '.agents/skills/**'
      - 'scripts/ops/**'
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'scripts/ops/**'
  workflow_dispatch:

jobs:
  run-evals:
    name: Skill Quality & Structural Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Structural Dry-Run Verification
        run: |
          pnpm agents:check
          node scripts/ops/run-skill-evals.mjs --dry-run
          node scripts/ops/run-skill-routing-evals.mjs --dry-run
          node scripts/ops/skills-status.mjs
