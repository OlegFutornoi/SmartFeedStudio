name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Required for creating GitHub Releases and uploading binary assets

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  # ============================================================================
  # Publish Tauri Desktop App Installers (.dmg, .deb, .exe, .msi) to GitHub Release
  # ============================================================================
  publish-desktop:
    name: Build & Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm package manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22 LTS with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Install Linux system dependencies required by WebKitGTK, Tauri, and Keyring
      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm build:shared

      - name: Build & Publish Desktop Assets to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'SmartFeed Studio ${{ github.ref_name }}'
          releaseBody: |
            ## SmartFeed Studio ${{ github.ref_name }}
            Automated production build for Windows, macOS, and Linux.

            ### Assets
            - **macOS**: `.dmg` (Apple Silicon & Intel)
            - **Windows**: `.msi` / `.exe` installer
            - **Linux**: `.deb` / `.AppImage`
          releaseDraft: false
          prerelease: false
