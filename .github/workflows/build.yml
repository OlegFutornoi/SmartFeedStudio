name: Build SmartFeedStudio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Збірка бекенду, адмінки та спільних пакетів (через Turborepo)
  build-web-and-backend:
    name: Build Web & Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting
        run: pnpm lint

      - name: Build Workspace (Turborepo)
        run: pnpm build # Автоматично збере backend-api, admin-portal та shared

  # 2. Збірка десктопного клієнта Tauri (Rust) під різні ОС
  build-desktop-tauri:
    name: Build Desktop App (${{ matrix.os }})
    needs: build-web-and-backend # Чекаємо успішної перевірки коду з попереднього кроку
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Для Linux (Ubuntu) Tauri потребує встановлення системних бібліотек
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        run: pnpm --filter @smartfeed/desktop tauri:build
