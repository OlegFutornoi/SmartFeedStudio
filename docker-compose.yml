version: '3.8'

services:
  postgre:
    image: postgres:16-alpine
    container_name: smartfeed-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: smartfeed_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smartfeed_db']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-e2e:
    image: postgres:16-alpine
    container_name: smartfeed-postgres-e2e
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: smartfeed_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smartfeed_test_db']
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartfeed-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: smartfeed-minio
    restart: unless-stopped
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: smartfeed-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb myminio/smartfeed-storage || true;
      /usr/bin/mc anonymous set download myminio/smartfeed-storage || true;
      exit 0;
      "

  sqlite-dev:
    build:
      context: ./tools/sqlite-dev-server
      dockerfile: Dockerfile
    container_name: smartfeed-sqlite-dev
    restart: unless-stopped
    ports:
      - '5001:5001'
    volumes:
      - sqlite_data:/data
    environment:
      - PORT=5001
      - DB_PATH=/data/smartfeed-dev.db
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:5001/health']
      interval: 5s
      timeout: 3s
      retries: 5

  sqlite-dev-e2e:
    build:
      context: ./tools/sqlite-dev-server
      dockerfile: Dockerfile
    container_name: smartfeed-sqlite-dev-e2e
    restart: unless-stopped
    ports:
      - '5002:5001'
    tmpfs:
      - /data
    environment:
      - PORT=5001
      - DB_PATH=/data/smartfeed-e2e.db
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:5001/health']
      interval: 5s
      timeout: 3s
      retries: 5

  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: smartfeed-omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - '20128:20128'
    volumes:
      - omniroute_data:/app/data
    environment:
      - PORT=20128
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:20128/health || exit 0']
      interval: 10s
      timeout: 5s
      retries: 3

  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:latest
    container_name: smartfeed-headroom
    restart: unless-stopped
    command: ['--host', '0.0.0.0', '--port', '8787']
    ports:
      - '8787:8787'
    environment:
      - HEADROOM_HOST=0.0.0.0
      - HEADROOM_ALLOW_UNAUTHENTICATED_BIND=1
      - HEADROOM_BEACON=off
      - DO_NOT_TRACK=1
      - OPENAI_TARGET_API_URL=http://omniroute:20128/v1
    volumes:
      - headroom_data:/home/nonroot/.headroom
    depends_on:
      - omniroute
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8787/livez']
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  sqlite_data:
    driver: local
  omniroute_data:
    driver: local
  headroom_data:
    driver: local
